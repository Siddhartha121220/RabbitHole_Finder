services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit
      POSTGRES_DB: rabbithole
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbithole"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [./mlflow:/mlflow]

volumes:
  pgdata:
