[project]
name = "rabbithole"
version = "0.1.0"
description = "Recommends the next Wikipedia rabbit hole from what you already love."
authors = [
    { name = "Siddhartha121220", email = "siddhu.gopala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "dagster>=1.13.27",
    "dagster-webserver>=1.13.27",
    "datasets>=5.1.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "mlflow-skinny>=3.17.2",
    "pgvector>=0.5.1",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-igraph>=1.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "torch>=2.15.0",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rabbithole = "rabbithole.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# igraph, scipy, scikit-learn and datasets ship without complete type hints. Strict mode stays on,
# except for the rules that only report "this third-party value has an unknown type".
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["rabbithole"]
# backend/alembic/ (migrations folder) would otherwise make the alembic package look local
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# marimo renders a cell's last bare expression as its output
"**/notebooks/*.py" = ["B018"]
"../notebooks/*.py" = ["B018"]

# CPU-only PyTorch (sentence-transformers dependency). The default Linux wheel bundles CUDA (~3 GB);
# a GPU is optional and handled by the Colab/Kaggle export path instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
