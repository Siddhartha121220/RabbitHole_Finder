[project]
name = "rabbithole"
version = "0.1.0"
description = "Recommends the next Wikipedia rabbit hole from what you already love."
authors = [
    { name = "Siddhartha121220", email = "siddhu.gopala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["rabbithole"]
